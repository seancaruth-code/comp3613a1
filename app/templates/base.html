<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', path='img/favicon.ico')}}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,100,1,200"
        rel="stylesheet" />
    <link href="{{ url_for('static', path='css/app.css')}}" rel="stylesheet">

    {% block external_css %}{% endblock %}
    {% block internal_css %}{% endblock %}
</head>

<body>
    {% block content %}{% endblock %}

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="appToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true" data-bs-autohide="true" data-bs-delay="2000">
            <div class="toast-header">
                <strong class="me-auto" id="toastTitle"></strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="toastContent"></div>
        </div>
    </div>

    <script>
      (() => {
        const key = "campusnest_tab_token";
        const urlToken = new URLSearchParams(window.location.search).get("tab_token");
        if (urlToken) sessionStorage.setItem(key, urlToken);
        const token = sessionStorage.getItem(key);
        if (!token) return;
        const addToken = (value) => {
          const url = new URL(value, window.location.origin);
          if (url.origin !== window.location.origin) return value;
          url.searchParams.set("tab_token", token);
          return url.pathname + url.search + url.hash;
        };
        document.querySelectorAll("a[href], form[action]").forEach((element) => {
          const attribute = element.tagName === "FORM" ? "action" : "href";
          const value = element.getAttribute(attribute);
          if (value && !value.startsWith("#")) element.setAttribute(attribute, addToken(value));
        });
        document.querySelectorAll("form input[name='tab_token']").forEach((input) => {
          input.value = token;
        });
        document.querySelectorAll("form[method='post'], form[method='POST']").forEach((form) => {
          form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const response = await fetch(form.action, {
              method: "POST",
              body: new FormData(form),
              headers: { "Authorization": `Bearer ${token}` }
            });
            if (response.ok) {
              const next = new URL(response.url, window.location.origin);
              next.searchParams.set("tab_token", token);
              window.location.assign(next.pathname + next.search + next.hash);
              return;
            }
            window.location.reload();
          });
        });
        document.querySelectorAll("a[href*='/logout']").forEach((link) => {
          link.addEventListener("click", () => sessionStorage.removeItem(key));
        });
      })();
    </script>

    {% block external_js %}{% endblock %}
</body>

</html>
