{% extends "base.html" %}
{% block title %}Sign in{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="auth-panel">
    <a class="auth-back" href="{{ url_for('index_view') }}">← Home</a>
    <div class="brand-wordmark">CampusNest</div>
    <p class="auth-tagline">Welcome back. Sign in to your account.</p>

    <form id="login-form" method="POST" action="{{ url_for('login_action_ajax') }}">
      <div class="mb-3">
        <label class="form-label" for="username">Username</label>
        <input class="form-control" type="text" id="username" name="username" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" type="password" id="password" name="password" required>
      </div>
      <div class="d-grid gap-2 mb-3">
        <button class="btn btn-primary btn-lg" type="submit">Sign in</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('register_view') }}">Create an account</a>
      </div>
    </form>

    {% for message in get_flashed_messages(request) %}
    <div class="alert alert-{{ message.type }} mb-0" role="alert">{{ message.message }}</div>
    {% endfor %}
  </div>
</div>
<script>
  document.getElementById("login-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const form = event.currentTarget;
    const response = await fetch(form.action, {
      method: "POST",
      body: new FormData(form),
      headers: { "Accept": "application/json" }
    });
    const data = await response.json();
    if (!response.ok) {
      const error = document.createElement("div");
      error.className = "alert alert-danger mb-0";
      error.textContent = data.detail || "Unable to sign in.";
      form.parentElement.appendChild(error);
      return;
    }
    sessionStorage.setItem("campusnest_tab_token", data.token);
    window.location.assign(data.destination + "?tab_token=" + encodeURIComponent(data.token));
  });
</script>
{% endblock %}
